# x86_64 macOS build, run under Rosetta 2: exercises the x86_64 host gadgets
# (the Windows x64 code path) on an Apple silicon machine.
#   meson setup build-x86-rosetta --cross-file tools/cross/macos-x86_64.ini -Dguest_arch=x86
[binaries]
c = ['clang', '-arch', 'x86_64']
objc = ['clang', '-arch', 'x86_64']
ar = 'ar'
strip = 'strip'

[host_machine]
system = 'darwin'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'

[project options]
cli = 'enabled'
